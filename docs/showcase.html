<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Block showcase · grapesjs-advance-components</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/grapesjs@0.22.16/dist/css/grapes.min.css">
<style>
  html,body{margin:0;height:100%;font-family:system-ui,sans-serif}
  .bar{min-height:44px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:6px 16px;background:#1c1c24;color:#ececf3;font-size:.9rem}
  .bar a{color:#a5a0ff;text-decoration:none}
  .bar button{padding:5px 12px;border:1px solid #3f3f46;border-radius:6px;background:none;color:inherit;cursor:pointer}
  .bar button[aria-pressed=true]{background:#4f46e5;border-color:#4f46e5}
  .bar .hint{margin-left:auto;opacity:.7}
  #gjs{flex:1;min-height:0}
  body{display:flex;flex-direction:column}
</style>
</head>
<body>
<div class="bar">
  <strong>Block showcase</strong>
  <a href="index.html">&larr; Docs</a>
  <button id="light" aria-pressed="true">Light</button>
  <button id="dark" aria-pressed="false">Dark</button>
  <button id="accent">Re-skin: teal</button>
  <span class="hint">Every block on one page. Dark mode is <code>data-aac-theme="dark"</code>; re-skin is one CSS variable.</span>
</div>
<div id="gjs"></div>
<script src="https://cdn.jsdelivr.net/npm/grapesjs@0.22.16/dist/grapes.min.js"></script>
<script src="dist/index.global.js"></script>
<script>
  const ids = ['header-block','hero-block','features-block','faq-block','pricing-block','checkout-button-block','form-block','newsletter-block','cta-block',
    'quote-block','slider-block','progress-bar-block','dropdown-block','button-block','divider-block','list-block','footer-block'];
  const editor = window.editor = grapesjs.init({
    container: '#gjs', height: '100%', storageManager: false,
    plugins: ['grapesjs-advance-components'],
  });
  editor.onReady(() => {
    // Typography belongs to the host page, so the demo sets what a real site would.
    editor.addStyle('body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.6;margin:0}' +
      'h1{margin:28px 28px 8px}p{margin:8px 28px}.aac-field,.aac-faq,.aac-slider,.aac-quote,.aac-progress,.aac-divider,.aac-button,.aac-pricing{margin-left:28px;margin-right:28px}.aac-pricing{margin-left:auto;margin-right:auto}');
    editor.setComponents('');
    ids.forEach((id) => editor.addComponents(editor.Blocks.get(id).getContent()));
  });

  const theme = (name) => {
    editor.getWrapper().addAttributes({ 'data-aac-theme': name });
    document.getElementById('light').setAttribute('aria-pressed', String(name === 'light'));
    document.getElementById('dark').setAttribute('aria-pressed', String(name === 'dark'));
  };
  document.getElementById('light').onclick = () => theme('light');
  document.getElementById('dark').onclick = () => theme('dark');
  let teal = false;
  document.getElementById('accent').onclick = () => {
    teal = !teal;
    const el = editor.Canvas.getDocument().documentElement;
    el.style.setProperty('--aac-accent', teal ? '#0d9488' : '');
    el.style.setProperty('--aac-accent-hover', teal ? '#0f766e' : '');
    el.style.setProperty('--aac-ring', teal ? 'rgba(13,148,136,.35)' : '');
    document.getElementById('accent').textContent = teal ? 'Re-skin: reset' : 'Re-skin: teal';
  };
</script>
</body>
</html>
