<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>grapesjs-advance-components demo</title>
  <link rel="stylesheet" href="../node_modules/grapesjs/dist/css/grapes.min.css" />
  <style>html,body{margin:0;height:100%}</style>
</head>
<body>
  <div id="gjs" style="height:100%"></div>
  <script src="../node_modules/grapesjs/dist/grapes.min.js"></script>
  <script src="../dist/index.global.js"></script>
  <script>
    // Demo provider: no network, no key. Swap for createFetchGenerator('http://localhost:8787/generate')
    // (see examples/ai-server.mjs) to talk to a real model.
    const fakeModel = async ({ prompt, mode, currentHtml }) => {
      await new Promise((r) => setTimeout(r, 400));
      if (prompt.includes('fail')) throw new Error('Demo provider error');
      return '```html\n<section style="padding:24px"><h2>' + prompt.replace(/</g, '&lt;') + '</h2>' +
        '<p>(' + mode + ' mode) Generated by the demo provider.</p>' +
        '<script>alert("stripped")<\/script><img src="x" onerror="alert(1)"></section>\n```';
    };

    window.editor = grapesjs.init({
      container: '#gjs',
      height: '100%',
      storageManager: false,
      plugins: ['grapesjs-advance-components'],
      pluginsOpts: { 'grapesjs-advance-components': { ai: { generate: fakeModel } } },
      components: '<h1>Hello</h1><p>Select me, then click ✨ in the toolbar.</p>',
    });
  </script>
</body>
</html>
